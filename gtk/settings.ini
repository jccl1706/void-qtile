# GENERATED BY bin/theme.sh FROM themes/nord.conf - DO NOT EDIT.
#
# gtk-application-prefer-dark-theme IS THE PART THAT MATTERS and the part most
# often left out: without it GTK renders its light variant regardless of the
# theme name, so file pickers come up white against a dark desktop.

[Settings]
gtk-theme-name=Nordic
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=28
gtk-font-name=DejaVu Sans 11
