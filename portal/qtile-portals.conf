# xdg-desktop-portal backend selection for qtile.
#
# WITHOUT THIS THE PORTAL ANSWERS "NO PREFERENCE" TO EVERYTHING. A GTK app on
# Wayland asks the portal whether to be light or dark; the portal routes that
# to whichever BACKEND is configured for the Settings interface; and it picks
# the backend by matching $XDG_CURRENT_DESKTOP against the UseIn= lines in
# /usr/share/xdg-desktop-portal/portals/*.portal.
#
# qtile sets no XDG_CURRENT_DESKTOP of its own and is in nobody's UseIn= list,
# so nothing was selected and org.freedesktop.appearance color-scheme came
# back as 0 - no preference - no matter what gsettings held. Firefox then
# rendered light with a perfectly correct GTK config sitting beside it.
#
# This file is read as <desktop>-portals.conf, so .bash_profile must export
# XDG_CURRENT_DESKTOP=qtile for it to be found at all.

[preferred]
# gtk provides Settings, FileChooser, Print and the rest.
default=gtk

# EXCEPT screenshot and screencast, which gtk cannot do on wlroots - it would
# offer a GNOME implementation that is not running. wlr is the one that can
# actually capture this compositor's output.
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
