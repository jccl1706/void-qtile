# =========================================================================
# nord
# =========================================================================
#
# Read by bin/theme.sh, which fans the values out to foot, dunst and GTK, and
# by qtile/theme.py, which parses this file directly at import. Plain
# key=value, no quoting, no shell syntax: it is parsed by both bash and
# Python, and anything cleverer would have to be implemented twice.
#
# Same convention as the fd44_hyprdot themes on the other machines, so that
# the two can be compared without translating between them.
#
# EVERY COLOUR BELOW IS AN OFFICIAL NORD VALUE, not an approximation chosen to
# look right beside one. The palette is published as sixteen colours picked
# together; mixing in a hand-tuned shade undoes that, and it is invisible
# until two of them sit adjacent.
#
#   Polar Night  nord0 #2e3440  nord1 #3b4252  nord2 #434c5e  nord3 #4c566a
#   Snow Storm   nord4 #d8dee9  nord5 #e5e9f0  nord6 #eceff4
#   Frost        nord7 #8fbcbb  nord8 #88c0d0  nord9 #81a1c1  nord10 #5e81ac
#   Aurora       nord11 #bf616a (red)     nord12 #d08770 (orange)
#                nord13 #ebcb8b (yellow)  nord14 #a3be8c (green)
#                nord15 #b48ead (purple)
#
#   https://www.nordtheme.com/docs/colors-and-palettes

name=nord
appearance=dark

# --- the raw palette, by Nord's own numbering ----------------------------
# Kept because every Nord reference and every other Nord config uses these
# names; the semantic keys below are what configs should actually reference.
nord0=#2e3440
nord1=#3b4252
nord2=#434c5e
nord3=#4c566a
nord4=#d8dee9
nord5=#e5e9f0
nord6=#eceff4
nord7=#8fbcbb
nord8=#88c0d0
nord9=#81a1c1
nord10=#5e81ac
nord11=#bf616a
nord12=#d08770
nord13=#ebcb8b
nord14=#a3be8c
nord15=#b48ead

# --- semantic ------------------------------------------------------------
bg=#2e3440
fg=#d8dee9
fgBright=#eceff4
dim=#4c566a
surface=#3b4252
surfaceHigh=#434c5e
outline=#434c5e

accent=#88c0d0
accentDim=#5e81ac
accentFg=#2e3440

ok=#a3be8c
warn=#ebcb8b
danger=#bf616a

# --- terminal ------------------------------------------------------------
# foot wants these WITHOUT the leading #, which bin/theme.sh strips. Written
# with it here so the file reads the same as every other colour.
term_bg=#2e3440
term_fg=#d8dee9
term_cursor_fg=#2e3440
term_cursor_bg=#88c0d0
term_sel_bg=#88c0d0
term_sel_fg=#2e3440

term_color0=#3b4252
term_color1=#bf616a
term_color2=#a3be8c
term_color3=#ebcb8b
term_color4=#81a1c1
term_color5=#b48ead
term_color6=#88c0d0
term_color7=#e5e9f0

# Nord publishes no second set of eight. These are the usual convention in
# Nord terminal themes: a lighter Polar Night for black, the Frost teal for
# cyan, the brightest Snow Storm for white, and the Aurora colours unchanged
# - because an "intense" Aurora red would be a colour Nord does not define.
term_color8=#4c566a
term_color9=#bf616a
term_color10=#a3be8c
term_color11=#ebcb8b
term_color12=#81a1c1
term_color13=#b48ead
term_color14=#8fbcbb
term_color15=#eceff4

# --- the desktop ---------------------------------------------------------
# Nordic is a real Nord GTK theme rather than Adwaita with the named colours
# overridden, so widget internals follow too. It is NOT packaged for Void and
# lives in ~/.local/share/themes - bin/fetch-themes.sh puts it back, because
# nothing in xbps will.
gtk_theme=Nordic
icon_theme=Adwaita
cursor_theme=Bibata-Modern-Classic
# 28 is 42 real pixels at this panel's 1.5 scale - see docs/CURSOR.md.
cursor_size=28
font=DejaVu Sans
font_size=11
